<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fax PDF Preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        display: flex; flex-direction: column; height: 100vh;
        background: #f5f5f5;
    }
    .toolbar {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 8px;
        padding: 10px 20px; background: #1a1a2e; color: #fff;
        flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .toolbar .title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
    .toolbar .actions { display: flex; gap: 8px; }
    .btn {
        padding: 6px 16px; border-radius: 4px; font-size: 13px;
        cursor: pointer; text-decoration: none; border: none; display: inline-block;
    }
    .btn-download { background: #0d47a1; color: #fff; }
    .btn-download:hover { background: #1565c0; }
    .btn-close { background: #555; color: #fff; }
    .btn-close:hover { background: #777; }
    .viewer { flex: 1; overflow: hidden; background: #525659; }
    .viewer iframe { width: 100%; height: 100%; border: none; }
    .no-pdf {
        display: none; flex-direction: column; align-items: center; justify-content: center;
        flex: 1; color: #888; font-size: 16px; gap: 12px;
    }
    .no-pdf span { font-size: 48px; }
</style>
</head>
<body>
    <div class="toolbar">
        <span class="title" id="pdf-title">📄 Loading...</span>
        <div class="actions">
            <a class="btn btn-download" id="btn-download" href="#" download="fax.pdf">⬇ Download PDF</a>
            <button class="btn btn-close" id="btn-close">✕ Close</button>
        </div>
    </div>
    <div class="viewer" id="viewer">
        <iframe id="pdf-embed" src="" style="width:100%;height:100%;border:none;"></iframe>
    </div>
    <div class="no-pdf" id="no-pdf">
        <span>📭</span>
        <p>No PDF data found. The preview session may have expired.</p>
    </div>

    <script src="preview.js"></script>
</body>
</html>
